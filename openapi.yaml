openapi: 3.0.3
info:
  title: Order Tracker API
  version: 1.0.0
  description: API for creating, retrieving, updating, and filtering orders.

servers:
  - url: http://localhost:5000

tags:
  - name: Orders
    description: Order management operations

paths:
  /api/orders:
    post:
      tags: [Orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An order with this ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: JSON body is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          example: CUST001
      responses:
        "200":
          description: Matching orders, or all orders when no filters are supplied
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/orders/{order_id}:
    get:
      tags: [Orders]
      summary: Get an order by ID
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{order_id}/status:
    put:
      tags: [Orders]
      summary: Update an order's status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatus"
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: JSON body is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: ORD001

  schemas:
    Order:
      type: object
      required:
        - order_id
        - item_name
        - quantity
        - customer_id
        - status
      properties:
        order_id:
          type: string
          minLength: 1
          example: ORD001
        item_name:
          type: string
          minLength: 1
          example: Laptop
        quantity:
          type: integer
          minimum: 1
          example: 1
        customer_id:
          type: string
          minLength: 1
          example: CUST001
        status:
          $ref: "#/components/schemas/OrderStatus"

    CreateOrder:
      type: object
      required:
        - order_id
        - item_name
        - quantity
        - customer_id
      properties:
        order_id:
          type: string
          minLength: 1
          example: ORD001
        item_name:
          type: string
          minLength: 1
          example: Laptop
        quantity:
          type: integer
          minimum: 1
          example: 1
        customer_id:
          type: string
          minLength: 1
          example: CUST001
        status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
          default: pending

    UpdateOrderStatus:
      type: object
      required:
        - new_status
      properties:
        new_status:
          $ref: "#/components/schemas/OrderStatus"

    OrderStatus:
      type: string
      enum:
        - pending
        - processing
        - shipped
        - delivered
        - cancelled
      example: pending

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: JSON body is required.

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties:
                type: string
          example:
            status: '''status'' must be one of these options: "pending", "processing", "shipped", "delivered", "cancelled".'
